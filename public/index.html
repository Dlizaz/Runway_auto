<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Runway Video Queue</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>🎬 Runway Video Queue</h1>
    <p class="subtitle">Chọn model/thời lượng dùng chung, rồi bấm "+" để thêm từng cặp ảnh + prompt. Bấm "Bắt đầu render" là có thể đóng tab đi làm việc khác.</p>

    <div class="card">
      <form id="uploadForm">
        <div class="global-settings">
          <label class="field inline">
            <span>Model</span>
            <select id="modelInput">
              <option value="gen4.5">gen4.5</option>
              <option value="seedance2_5">seedance2_5</option>
              <option value="wan3">wan3</option>
              <option value="veo3_1">veo3_1</option>
              <option value="hailuo3">hailuo3</option>
            </select>
          </label>

          <label class="field inline">
            <span>Thời lượng (giây)</span>
            <input type="number" id="durationInput" value="5" min="2" max="30" />
          </label>

          <label class="field inline checkbox">
            <input type="checkbox" id="upscaleInput" checked />
            <span>Tự động upscale 4K sau khi render</span>
          </label>
        </div>

        <div id="rowsContainer"></div>

        <button type="button" id="addRowBtn">+ Thêm ảnh / prompt</button>

        <hr />

        <button type="submit" id="submitBtn">Bắt đầu render</button>
      </form>
      <p id="formMsg"></p>
    </div>

    <div class="card">
      <div class="controls">
        <button id="pauseBtn">⏸ Pause</button>
        <button id="resumeBtn">▶ Resume</button>
        <button id="stopBtn">⏹ Stop</button>
        <span id="queueState"></span>
      </div>

      <table id="statusTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Prompt</th>
            <th>Trạng thái</th>
            <th>Video</th>
            <th>Google Drive</th>
          </tr>
        </thead>
        <tbody id="statusBody"></tbody>
      </table>
    </div>
  </div>

  <template id="rowTemplate">
    <div class="row-item">
      <span class="row-id"></span>
      <input type="file" class="row-image" accept="image/*" />
      <textarea class="row-prompt" placeholder="Nhập prompt cho video này..." rows="2"></textarea>
      <button type="button" class="row-remove">✕</button>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
